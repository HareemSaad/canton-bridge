specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Gateway
    network: plasma
    source:
      address: "0x0000000000000000000000000000000000000000" # replace after deployment
      abi: Gateway
      startBlock: 0 # replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Lock
      abis:
        - name: Gateway
          file: ./abis/Gateway.json
      eventHandlers:
        - event: locked(indexed uint256,indexed address,uint256,string,indexed bytes32)
          handler: handleLocked
      file: ./src/gateway.ts
