specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  # ── Production: CantonBridge ──────────────────────────────────────────────
  - kind: ethereum
    name: CantonBridge
    network: plasma-testnet
    source:
      address: "0x59acb2967cc50c25b9d12b4b329e4da94054a897"
      abi: CantonBridge
      startBlock: 21223929
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Deposit
        - TokenRegistration
      abis:
        - name: CantonBridge
          file: ./abis/CantonBridge.json
      eventHandlers:
        - event: DepositToCanton(indexed address,indexed address,uint256,indexed bytes32,uint256)
          handler: handleDeposit
        - event: TokenRegistered(indexed address,string,string)
          handler: handleTokenRegistered
        - event: TokenDeregistered(indexed address)
          handler: handleTokenDeregistered
      file: ./src/cantonBridge.ts

  # ── Legacy: Gateway (kept for historical data) ─────────────────────────────
  - kind: ethereum
    name: Gateway
    network: plasma-testnet
    source:
      address: "0x0000000000000000000000000000000000000000" # replace after deployment
      abi: Gateway
      startBlock: 21223930 # replace with deployment block
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Lock
      abis:
        - name: Gateway
          file: ./abis/Gateway.json
      eventHandlers:
        - event: locked(indexed uint256,indexed address,uint256,string,indexed bytes32)
          handler: handleLocked
      file: ./src/gateway.ts
